<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blooming Flower</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="glow"></div>

  <div class="flower">
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>

    <div class="head">
      <div class="core"></div>

      <div class="stamen" style="--i:0"></div>
      <div class="stamen" style="--i:1"></div>
      <div class="stamen" style="--i:2"></div>
      <div class="stamen" style="--i:3"></div>
      <div class="stamen" style="--i:4"></div>
      <div class="stamen" style="--i:5"></div>
      <div class="stamen" style="--i:6"></div>
      <div class="stamen" style="--i:7"></div>

      <div class="petal outer" style="--i:0"></div>
      <div class="petal outer" style="--i:1"></div>
      <div class="petal outer" style="--i:2"></div>
      <div class="petal outer" style="--i:3"></div>
      <div class="petal outer" style="--i:4"></div>
      <div class="petal outer" style="--i:5"></div>
      <div class="petal outer" style="--i:6"></div>
      <div class="petal outer" style="--i:7"></div>

      <div class="petal middle" style="--i:0"></div>
      <div class="petal middle" style="--i:1"></div>
      <div class="petal middle" style="--i:2"></div>
      <div class="petal middle" style="--i:3"></div>
      <div class="petal middle" style="--i:4"></div>
      <div class="petal middle" style="--i:5"></div>
      <div class="petal middle" style="--i:6"></div>
      <div class="petal middle" style="--i:7"></div>

      <div class="petal inner" style="--i:0"></div>
      <div class="petal inner" style="--i:1"></div>
      <div class="petal inner" style="--i:2"></div>
      <div class="petal inner" style="--i:3"></div>
      <div class="petal inner" style="--i:4"></div>
      <div class="petal inner" style="--i:5"></div>
    </div>
  </div>

  <span class="spark" style="--x:8%;  --dx:40px;  --t:11s; --d:0s"></span>
  <span class="spark" style="--x:18%; --dx:-30px; --t:14s; --d:3s"></span>
  <span class="spark" style="--x:30%; --dx:50px;  --t:12s; --d:6s"></span>
  <span class="spark" style="--x:42%; --dx:-40px; --t:15s; --d:1s"></span>
  <span class="spark" style="--x:58%; --dx:30px;  --t:13s; --d:4s"></span>
  <span class="spark" style="--x:70%; --dx:-50px; --t:11s; --d:7s"></span>
  <span class="spark" style="--x:82%; --dx:35px;  --t:14s; --d:2s"></span>
  <span class="spark" style="--x:92%; --dx:-25px; --t:12s; --d:5s"></span>

</body>
</html>
